name: Keep-Alive 7/24 Anti-Sleep Ping

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance idle spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping yusasufhin.com Cockpit
        run: |
          echo "Pinging production endpoints..."
          curl -s -f -m 15 "https://yusasufhin-cockpit.onrender.com/api/auth/public_info" || true
          curl -s -f -m 15 "https://yusasufhin.com/api/auth/public_info" || true
          echo "Ping complete."
