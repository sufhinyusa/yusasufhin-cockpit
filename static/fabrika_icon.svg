<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f2fe" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />
  
  <!-- Factory / Hexagon AI Core -->
  <path d="M256 96 L396 176 L396 336 L256 416 L116 336 L116 176 Z" fill="none" stroke="url(#neonCyan)" stroke-width="12" filter="url(#glow)" />
  
  <!-- Central Pulse Nucleus -->
  <circle cx="256" cy="256" r="48" fill="url(#neonCyan)" filter="url(#glow)" />
  <path d="M256 160 L256 208 M256 304 L256 352 M170 256 L218 256 M294 256 L342 256" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
</svg>
